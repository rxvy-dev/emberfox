// Ignifox autoconfig. (The first line of this file is always skipped by Gecko.)
//
// 1. Hard-locks every telemetry / studies / data-upload switch so nothing can
//    flip them back on (not the UI, not an experiment, not a sync'd pref).
// 2. Boots Ignifox Studio: registers chrome://ignifox/, about:ignifox and the
//    live UI customization engine.
//
// Locked prefs here are the "no telemetry, ever" guarantee. Everything that is
// a matter of taste lives in ignifox-branding.js as a normal default instead,
// so users can change it.

// ---------------------------------------------------------------- telemetry
lockPref("toolkit.telemetry.enabled", false);
lockPref("toolkit.telemetry.unified", false);
lockPref("toolkit.telemetry.archive.enabled", false);
lockPref("toolkit.telemetry.server", "data:,");
lockPref("toolkit.telemetry.newProfilePing.enabled", false);
lockPref("toolkit.telemetry.shutdownPingSender.enabled", false);
lockPref("toolkit.telemetry.shutdownPingSender.enabledFirstSession", false);
lockPref("toolkit.telemetry.firstShutdownPing.enabled", false);
lockPref("toolkit.telemetry.updatePing.enabled", false);
lockPref("toolkit.telemetry.bhrPing.enabled", false);
lockPref("toolkit.telemetry.reportingpolicy.firstRun", false);
lockPref("toolkit.telemetry.dap_enabled", false);
lockPref("toolkit.telemetry.coverage.opt-out", true);
lockPref("toolkit.coverage.opt-out", true);
lockPref("toolkit.coverage.endpoint.base", "");
lockPref("datareporting.healthreport.uploadEnabled", false);
lockPref("datareporting.policy.dataSubmissionEnabled", false);
lockPref("datareporting.usage.uploadEnabled", false);
lockPref("browser.ping-centre.telemetry", false);
lockPref("browser.newtabpage.activity-stream.feeds.telemetry", false);
lockPref("browser.newtabpage.activity-stream.telemetry", false);
lockPref("browser.newtabpage.activity-stream.telemetry.privatePing.enabled", false);
lockPref("browser.urlbar.quicksuggest.dataCollection.enabled", false);
lockPref("dom.private-attribution.submission.enabled", false);
lockPref("default-browser-agent.enabled", false);

// ------------------------------------------------- studies / experiments
lockPref("app.shield.optoutstudies.enabled", false);
lockPref("app.normandy.enabled", false);
lockPref("app.normandy.api_url", "");
lockPref("messaging-system.rsexperimentloader.enabled", false);
lockPref("nimbus.rollouts.enabled", false);
lockPref("browser.discovery.enabled", false);
lockPref("extensions.getAddons.showPane", false);
lockPref("extensions.htmlaboutaddons.recommendations.enabled", false);

// ---------------------------------------------------------- crash reports
lockPref("breakpad.reportURL", "");
lockPref("browser.tabs.crashReporting.sendReport", false);
lockPref("browser.crashReports.unsubmittedCheck.enabled", false);
lockPref("browser.crashReports.unsubmittedCheck.autoSubmit2", false);

// ------------------------------------------------------- Ignifox Studio boot
(function igniBoot() {
  try {
    const Ci = Components.interfaces;
    const Cc = Components.classes;
    const S = typeof Services != "undefined" ? Services : null;
    const dirsvc = S ? S.dirsvc
      : Cc["@mozilla.org/file/directory_service;1"].getService(Ci.nsIProperties);
    const io = S ? S.io : Cc["@mozilla.org/network/io-service;1"].getService(Ci.nsIIOService);

    // <install dir>/studio/  holds the Studio engine and UI.
    const igniDir = dirsvc.get("GreD", Ci.nsIFile);
    igniDir.append("studio");
    if (!igniDir.exists()) {
      return; // engine not installed (e.g. stripped build) – telemetry locks above still apply
    }
    const manifest = igniDir.clone();
    manifest.append("chrome.manifest");
    const manifestURI = io.newFileURI(manifest);

    // Map chrome://ignifox/content/ -> <install>/studio/content/
    // The returned handle unregisters the mapping when garbage-collected, so
    // it is handed to the boot module, which keeps it for the app's lifetime.
    let chromeHandle = null;
    try {
      const aom = Cc["@mozilla.org/addons/addon-manager-startup;1"]
        .getService(Ci.amIAddonManagerStartup);
      chromeHandle = aom.registerChrome(manifestURI, [["content", "ignifox", "content/"]]);
    } catch (e) {
      // Older/odd builds: fall back to the classic chrome.manifest registration.
      Components.manager.QueryInterface(Ci.nsIComponentRegistrar).autoRegister(manifest);
    }

    const { IgniBoot } = ChromeUtils.importESModule("chrome://ignifox/content/boot.sys.mjs");
    IgniBoot.init({ chromeHandle });
  } catch (e) {
    Components.utils.reportError("[Ignifox] boot failed: " + e + "\n" + (e && e.stack));
  }
})();
