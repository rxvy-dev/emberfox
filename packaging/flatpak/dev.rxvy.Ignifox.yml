# Flatpak: works on every distro, including musl ones (Alpine, Void-musl,
# postmarketOS desktop) and immutable ones (Fedora Silverblue/Kinoite, SteamOS,
# Bazzite, NixOS, Vanilla OS).
#   flatpak-builder --user --install --force-clean build-flatpak packaging/flatpak/dev.rxvy.Ignifox.yml
# (build.sh flatpak fills in the tarball path for you)
id: dev.rxvy.Ignifox
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: ignifox
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=cups
  - --device=all
  - --filesystem=xdg-download
  - --persist=.ignifox
  - --env=MOZ_ENABLE_WAYLAND=1
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.portal.*
  - --talk-name=org.a11y.Bus
  - --own-name=org.mozilla.ignifox.*
  - --system-talk-name=org.freedesktop.NetworkManager
modules:
  - name: ignifox
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib
      - cp -a ignifox /app/lib/ignifox
      - rm -f /app/lib/ignifox/install.sh
      - mkdir -p /app/bin && printf '#!/bin/sh\nexec /app/lib/ignifox/ignifox "$@"\n' > /app/bin/ignifox && chmod 755 /app/bin/ignifox
      - sed 's|^Icon=ignifox|Icon=dev.rxvy.Ignifox|' ignifox/ignifox.desktop > dev.rxvy.Ignifox.desktop
      - install -Dm644 dev.rxvy.Ignifox.desktop /app/share/applications/dev.rxvy.Ignifox.desktop
      - for s in 16 32 48 64 128 256 512; do install -Dm644 ignifox/icons/hicolor/${s}x${s}/apps/ignifox.png /app/share/icons/hicolor/${s}x${s}/apps/dev.rxvy.Ignifox.png; done
      - install -Dm644 ignifox/icons/hicolor/scalable/apps/ignifox.svg /app/share/icons/hicolor/scalable/apps/dev.rxvy.Ignifox.svg
      - install -Dm644 dev.rxvy.Ignifox.metainfo.xml /app/share/metainfo/dev.rxvy.Ignifox.metainfo.xml
    sources:
      - type: archive
        path: IGNIFOX_TARBALL
        strip-components: 0
      - type: file
        path: dev.rxvy.Ignifox.metainfo.xml
