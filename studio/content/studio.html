<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src chrome:; script-src chrome:; style-src chrome: 'unsafe-inline'; img-src chrome: data: blob: moz-icon: moz-extension: moz-remote-image: https: file:; font-src chrome: file:; object-src 'none'">
  <meta name="color-scheme" content="dark light">
  <title>Ignifox Studio</title>
  <link rel="icon" href="chrome://ignifox/content/logo.svg">
  <link rel="stylesheet" href="chrome://ignifox/content/studio.css">
  <script type="module" src="chrome://ignifox/content/studio.js"></script>
</head>
<body>
  <aside class="nav">
    <a class="brand" href="#look" title="Ignifox Studio">
      <img src="chrome://ignifox/content/logo.svg" alt="" width="44" height="44">
      <div>
        <img class="wordmark" src="chrome://ignifox/content/wordmark.svg" alt="Ignifox" height="22">
        <span class="sub">Studio</span>
      </div>
    </a>
    <nav id="nav-links"></nav>
    <div class="nav-foot">
      <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>I</kbd> opens Studio<br>
      <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>Z</kbd> focus mode
    </div>
  </aside>

  <main id="main"></main>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="welcome" class="welcome" hidden></div>
</body>
</html>
