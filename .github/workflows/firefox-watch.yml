name: Firefox watch

# Every 6 hours: if Mozilla has shipped a Firefox newer than the latest
# Emberfox release, build and publish a new Emberfox automatically.
# This is how Firefox security fixes reach Emberfox users fast.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      new: ${{ steps.c.outputs.new }}
      firefox: ${{ steps.c.outputs.firefox }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(curl -fsSL https://product-details.mozilla.org/1.0/firefox_versions.json | jq -r .LATEST_FIREFOX_VERSION)
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || echo none)
          have="${tag#v}"; have="${have%-*}"
          echo "Mozilla: $latest   Emberfox: ${tag}"
          echo "firefox=$latest" >> "$GITHUB_OUTPUT"
          if [[ "$have" != "$latest" ]]; then echo "new=true" >> "$GITHUB_OUTPUT"; else echo "new=false" >> "$GITHUB_OUTPUT"; fi

  release:
    needs: check
    if: needs.check.outputs.new == 'true'
    uses: ./.github/workflows/release.yml
    with:
      firefox_version: ${{ needs.check.outputs.firefox }}
      revision: "1"
    secrets: inherit
