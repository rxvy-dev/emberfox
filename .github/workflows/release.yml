name: Release

# Builds Ignifox for x86_64 + aarch64 and publishes a GitHub Release.
#  - push a tag like v160.0.1-1   (Firefox 160.0.1, Ignifox revision 1)
#  - or run it by hand from the Actions tab
#  - or let firefox-watch.yml call it when Mozilla ships a new Firefox

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      firefox_version:
        description: "Firefox version to build on (or 'latest')"
        default: latest
      revision:
        description: "Ignifox revision on top of that Firefox (1, 2, …)"
        default: "1"
  workflow_call:
    inputs:
      firefox_version:
        type: string
        default: latest
      revision:
        type: string
        default: "1"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      firefox: ${{ steps.v.outputs.firefox }}
      revision: ${{ steps.v.outputs.revision }}
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        env:
          IN_FF: ${{ inputs.firefox_version }}
          IN_REL: ${{ inputs.revision }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == v* ]]; then
            V="${GITHUB_REF_NAME#v}"; FF="${V%-*}"; REL="${V##*-}"
            [[ "$FF" != "$V" ]] || REL=1
          else
            FF="${IN_FF:-latest}"; REL="${IN_REL:-1}"
            if [[ "$FF" == latest ]]; then
              FF=$(curl -fsSL https://product-details.mozilla.org/1.0/firefox_versions.json | jq -r .LATEST_FIREFOX_VERSION)
            fi
          fi
          [[ "$FF" =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo "bad Firefox version '$FF'"; exit 1; }
          [[ "$REL" =~ ^[0-9]+$ ]] || { echo "bad revision '$REL'"; exit 1; }
          { echo "firefox=$FF"; echo "revision=$REL"; echo "version=$FF-$REL"; echo "tag=v$FF-$REL"; } >> "$GITHUB_OUTPUT"
          echo "### Building Ignifox $FF-$REL" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.arch }}
    needs: meta
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick unzip xz-utils rpm

      - name: Repack Firefox ${{ needs.meta.outputs.firefox }}
        run: |
          echo "${{ needs.meta.outputs.revision }}" > VERSION
          ./build.sh repack --version "${{ needs.meta.outputs.firefox }}" --arch "${{ matrix.arch }}"

      - name: Telemetry audit
        run: ./build.sh audit

      - name: .deb
        run: ./build.sh deb

      - name: .rpm
        run: ./build.sh rpm && find dist -name '*.rpm' -exec mv {} dist/ \;

      - name: AppImage
        continue-on-error: true
        run: ./build.sh appimage

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: |
            dist/*.tar.xz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error

  android:
    name: Android
    needs: meta
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ needs.meta.outputs.version }}
    secrets: inherit

  flatpak:
    name: Flatpak
    needs: [meta, build]
    runs-on: ubuntu-24.04
    continue-on-error: true
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v8
        with:
          name: dist-x86_64
          path: dist

      - name: Prepare manifest
        run: |
          T=$(ls "$PWD"/dist/ignifox-*-linux-x86_64.tar.xz)
          sed "s|IGNIFOX_TARBALL|$T|" packaging/flatpak/dev.rxvy.Ignifox.yml > dev.rxvy.Ignifox.yml
          cp packaging/flatpak/dev.rxvy.Ignifox.metainfo.xml .

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Ignifox-${{ needs.meta.outputs.version }}-x86_64.flatpak
          manifest-path: dev.rxvy.Ignifox.yml
          upload-artifact: false

      - uses: actions/upload-artifact@v4
        with:
          name: dist-flatpak
          path: "*.flatpak"

  publish:
    name: Publish release
    needs: [meta, build, flatpak, android]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums + notes
        env:
          V: ${{ needs.meta.outputs.version }}
          FF: ${{ needs.meta.outputs.firefox }}
        run: |
          cd dist
          rm -f ./*.sha256
          sha256sum ./* | sed 's| \./| |' > SHA256SUMS
          cat > ../notes.md <<NOTES
          Ignifox **$V**, built on **Firefox $FF** ([Firefox $FF release notes](https://www.firefox.com/en-US/firefox/$FF/releasenotes/), including its security fixes).

          ### Download

          **Easiest:** paste into a terminal for the graphical installer:
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/rxvy-dev/ignifox/main/install.sh | bash
          \`\`\`

          | You're on | Get |
          |---|---|
          | Any Linux (glibc) | \`ignifox-$V-linux-x86_64.tar.xz\`, extract, run \`./install.sh\` (or \`--user\`) |
          | Any Linux, no install | \`Ignifox-$V-x86_64.AppImage\` |
          | Any Linux, sandboxed (incl. musl, immutable) | \`Ignifox-$V-x86_64.flatpak\` |
          | Debian · Ubuntu · Mint · Pop!_OS | \`ignifox_${V}_amd64.deb\` |
          | Fedora · openSUSE · RHEL | \`ignifox-*.x86_64.rpm\` |
          | Arch / Void / Gentoo | recipes in \`packaging/\` (updated automatically) |
          | ARM64 (Pi 5, Asahi, Snapdragon) | the \`aarch64\` / \`arm64\` files |
          | **Android phone** | \`ignifox-android-arm64.apk\` (32-bit phones: \`arm32\`) |

          **Android says "App not installed"?**
          - Use \`ignifox-android-arm64.apk\`. The \`x86_64\` APK is only for emulators and x86 tablets and will not install on a phone.
          - Uninstall any older Ignifox build first if this one will not install over it.
          - Let the download finish (about 240 MB) before opening it.

          Every file is listed in \`SHA256SUMS\`. Each build passed \`./build.sh audit\` (no telemetry binaries, all data-upload prefs locked off).
          NOTES
          sed -i 's/^          //' ../notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Ignifox ${{ needs.meta.outputs.version }}
          body_path: notes.md
          target_commitish: ${{ github.sha }}
          files: dist/*
          fail_on_unmatched_files: false

  recipes:
    name: Bump distro recipes
    needs: [meta, publish]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Update PKGBUILD, Void template, ebuild, AppStream
        run: ./scripts/update-recipes.sh "${{ needs.meta.outputs.version }}" dist

      - name: Commit
        run: |
          git config user.name "ignifox-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A packaging
          if git diff --cached --quiet; then echo "recipes already current"; exit 0; fi
          git commit -m "packaging: point recipes at ${{ needs.meta.outputs.version }}"
          git push origin HEAD:main
