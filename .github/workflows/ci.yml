name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint & tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit + consistency tests
        run: node --test tests/*.test.mjs

      - name: JavaScript syntax
        run: |
          for f in studio/content/*.mjs studio/content/studio.js; do
            node --check --input-type=module < "$f"
          done
          tail -n +2 settings/ignifox.cfg > "$RUNNER_TEMP/cfg.js" && node --check "$RUNNER_TEMP/cfg.js"
          node --check branding/ignifox-branding.js
          node --check settings/defaults/pref/autoconfig.js

      - name: Policies match Firefox's schema
        run: |
          pip install --quiet jsonschema
          python3 tests/check_policies.py

      - name: Shellcheck
        run: shellcheck -x -S warning install.sh build.sh scripts/*.sh packaging/*.sh packaging/appimage/*.sh tools/preview/run.sh tools/desktop-smoke.sh android/*.sh

      - name: Desktop entry + AppStream
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils appstream
          desktop-file-validate packaging/ignifox.desktop
          appstreamcli validate --no-net --explain packaging/flatpak/dev.rxvy.Ignifox.metainfo.xml || echo "::warning::AppStream validation reported issues"

  repack:
    name: Repack latest Firefox + audit
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick unzip xz-utils

      - name: Repack
        run: ./build.sh repack --arch x86_64

      - name: Telemetry audit
        run: ./build.sh audit

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: ignifox-test-build-x86_64
          path: dist/ignifox-*.tar.xz
          retention-days: 7

  desktop:
    name: Run it on a virtual screen
    needs: repack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ignifox-test-build-x86_64
          path: dist

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool imagemagick dbus-x11

      - name: Start Ignifox and check the new tab animates
        run: xvfb-run -a -s "-screen 0 1280x800x24" dbus-launch --exit-with-session tools/desktop-smoke.sh dist/ignifox-*.tar.xz smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke
          path: smoke

      # Screenshots also go to a side branch so they can be looked at without downloading a zip.
      - name: Publish screenshots to the desktop-screenshots branch
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p "$RUNNER_TEMP/shots" && cd "$RUNNER_TEMP/shots"
          cp "$GITHUB_WORKSPACE"/smoke/* . 2>/dev/null || true
          echo "Screenshots from the desktop test of $GITHUB_SHA" > README.md
          git init -q -b desktop-screenshots
          git config user.name "ignifox-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Desktop screenshots for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" desktop-screenshots
