name: Bug report
description: Something in Ignifox is broken
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Ignifox version
      description: Studio → About (or `ignifox --version`)
      placeholder: 160.0.1-1
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options: [tarball + install.sh, AppImage, Flatpak, .deb, .rpm, Arch PKGBUILD, Void template, Gentoo ebuild, built from source]
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distro, desktop and session
      placeholder: Arch, Hyprland, Wayland
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: It also happens with a fresh profile (`ignifox --ProfileManager` → new profile)
        - label: It does NOT happen in stock Firefox of the same version (otherwise report to Mozilla)
