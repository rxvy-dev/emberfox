name: Feature idea
description: Suggest something for Ignifox or Ignifox Studio
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Ignifox Studio – look & color, Ignifox Studio – placement, Privacy, Packaging / a distro, Something else]
